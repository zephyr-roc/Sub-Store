name = "sub-store-cf"
main = "dist/worker.js"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "SUB_STORE_INSTANCE"
class_name = "SubStoreInstance"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SubStoreInstance"]

[triggers]
crons = ["55 15 * * *"]

[vars]
SCRIPT_ENGINE = "quickjs"
SUB_STORE_BACKEND_CUSTOM_NAME = "Cloudflare Workers"

# Required: run "npx wrangler secret put SUB_STORE_FRONTEND_BACKEND_PATH"
# Enter a long, unpredictable path beginning with "/" and keep it private.
